<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Wax Inventory Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⛷️ Ski Wax Inventory</h1>
            <p class="subtitle">Professional ski wax and tuning supplies management</p>
        </header>

        <div class="actions">
            <button id="addProductBtn" class="btn btn-primary">
                <span>➕</span> Add New Product
            </button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search products...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="All-Temperature">All-Temperature</option>
                    <option value="Cold Wax">Cold Wax</option>
                    <option value="Warm Wax">Warm Wax</option>
                    <option value="Grip Wax">Grip Wax</option>
                    <option value="Tools">Tools</option>
                    <option value="Cleaners">Cleaners</option>
                </select>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalValue">$0</div>
                <div class="stat-label">Total Value</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lowStock">0</div>
                <div class="stat-label">Low Stock</div>
            </div>
        </div>

        <div id="productsGrid" class="products-grid">
            <!-- Products will be loaded here dynamically -->
        </div>
    </div>

    <!-- Modal for adding/editing products -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Product</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productCategory">Category *</label>
                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option value="All-Temperature">All-Temperature</option>
                        <option value="Cold Wax">Cold Wax</option>
                        <option value="Warm Wax">Warm Wax</option>
                        <option value="Grip Wax">Grip Wax</option>
                        <option value="Tools">Tools</option>
                        <option value="Cleaners">Cleaners</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Price ($) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productQuantity">Quantity *</label>
                        <input type="number" id="productQuantity" min="0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="productIcon">Icon/Emoji</label>
                    <input type="text" id="productIcon" placeholder="📦" maxlength="2">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
